name: StatusHub
options:
  bundleIdPrefix: com.jaredgantt
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: XMH4AVFC78
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.statushub
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Status Hub
    # Required for getUserMedia in the WKWebView. Without it iOS silently denies the mic and the app
    # never appears under Settings → Privacy → Microphone.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Status Hub uses the microphone for voice commands.
    # Required for the chat composer's photo attachments: the WKWebView file input offers Take Photo
    # (camera) and Photo Library natively, but only when these usage strings exist.
    INFOPLIST_KEY_NSCameraUsageDescription: Status Hub uses the camera to capture food and nutrition labels.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Status Hub attaches photos of food and nutrition labels.
targets:
  StatusHub:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Shared
      - path: Assets.xcassets
      # APNs sounds must live in the app bundle; the push payload names one by filename.
      - path: Sounds
        buildPhase: resources
    entitlements:
      path: StatusHub.entitlements
      properties:
        aps-environment: production   # production APNs for distribution (Ad Hoc / TestFlight / App Store) builds
        # Shared with the widget extension so it can read the hub password and authenticate its own
        # fetches. Same value as the app's implicit App-ID group, so the already-stored password keeps
        # resolving. Unlike Time Sensitive, this needs no portal capability.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaredgantt.statushub
        # Read-only Apple Health access for Apple Watch sleep (Sources/SleepSync.swift, docs/SLEEP.md).
        # The App ID's HEALTHKIT capability is what makes these signable (`asc.mjs capability`).
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        # TODO: add `com.apple.developer.usernotifications.time-sensitive: true` here once the
        # Time Sensitive Notifications capability is enabled on the App ID. It is the only way a
        # normal push breaks through a Focus. It canNOT be enabled via the App Store Connect API
        # (not among the 28 capabilityType values it accepts) — it needs the developer portal or
        # Xcode's Signing & Capabilities, and Xcode's account login must be valid to regenerate the
        # profile. Until then the server still SENDS interruption-level 'time-sensitive'; iOS just
        # ignores it without the entitlement, so nothing breaks — Focus simply isn't pierced.
    # Managed Info.plist (not GENERATE_INFOPLIST_FILE) so we can register the statushub:// URL scheme — a
    # one-tap home-screen shortcut opens statushub://record and the app auto-fires the voice FAB.
    info:
      path: Sources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Status Hub
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # HTTPS only — exempt. Without this declared, TestFlight holds every upload at "Missing
        # Compliance" and the tester group cannot install it until someone answers by hand.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Status Hub uses the microphone for voice commands.
        NSCameraUsageDescription: Status Hub uses the camera to capture food and nutrition labels.
        NSPhotoLibraryUsageDescription: Status Hub attaches photos of food and nutrition labels.
        # The hub page's navigator.geolocation in the WKWebView (voiceagent.js hereNow) needs it.
        NSLocationWhenInUseUsageDescription: For nearby requests.
        NSLocationAlwaysAndWhenInUseUsageDescription: Records your location history.   # docs/LOCATION.md
        # Shown on Health's permission sheet.
        NSHealthShareUsageDescription: Status Hub reads your sleep from Apple Health to keep a history of your nights alongside your other data.
        # Required by App Store Connect for the healthkit entitlement even though nothing is written.
        NSHealthUpdateUsageDescription: Status Hub does not write to Apple Health.
        # The live mic keeps streaming with the phone locked (Sources/LiveMic.swift, docs/LIVE-MIC.md);
        # location keeps the location history recording in the background (docs/LOCATION.md).
        UIBackgroundModes:
          - audio
          - location
        CFBundleURLTypes:
          - CFBundleURLName: com.jaredgantt.statushub
            CFBundleURLSchemes:
              - statushub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) HUB_APP
    dependencies:
      - target: StatusHubControls
        embed: true
      - target: StatusHubWatch
        embed: true
  # iOS 18 Control widget → the "Record" button appears in the Lock Screen / Control Center gallery.
  StatusHubControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Controls
      - path: Shared
    entitlements:
      path: StatusHubControls.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaredgantt.statushub
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: Status Hub
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.statushub.controls
        PRODUCT_NAME: StatusHubControls
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
  # The watch companion: the sessions, the shared hub conversation (recorded into — clips go to
  # /api/voice-command like the phone's microphone), and the day's nutrition and workout. Talks to the
  # hub directly with the token the phone hands over (Sources/WatchLink.swift → Watch/Hub.swift).
  StatusHubWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
      - path: WatchWidgets/RecordIntent.swift   # the Record control's intent runs in the app (WATCH_APP)
      - path: Shared/Auth.swift   # Auth.host only — the watch's token comes from the phone, not a password
      - path: Shared/LocationTrail.swift   # a point per use into the location history (docs/LOCATION.md)
      - path: Controls/RingsView.swift   # the /api/rings types and the card palette; its widget views go unused
      - path: AssetsWatch.xcassets
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Status Hub
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.jaredgantt.statushub
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Status Hub uses the microphone for voice commands.
        NSLocationWhenInUseUsageDescription: For nearby requests.   # Watch/Location.swift
        # A recording started on screen keeps going with the wrist lowered, so a command still ends at
        # its silence and the listener keeps listening (Watch/Capture.swift). UIBackgroundModes, not
        # WKBackgroundModes: the watch's key only takes session types, and audio is not one.
        UIBackgroundModes:
          - audio
          # No `location`: the watch takes a fix only while it is in front (docs/LOCATION.md).
        # statushub://record is what the complication opens — straight into recording.
        CFBundleURLTypes:
          - CFBundleURLName: com.jaredgantt.statushub.watch
            CFBundleURLSchemes:
              - statushub
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.statushub.watch
        PRODUCT_NAME: StatusHubWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WATCH_APP
    dependencies:
      - target: StatusHubWatchWidgets
        embed: true
  # The watch-face complication and the Record control (watchOS 26), both opening the app into
  # recording.
  StatusHubWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WatchWidgets
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Status Hub
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.statushub.watch.widgets
        PRODUCT_NAME: StatusHubWatchWidgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
  StatusHubMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
      # Auth lives in Shared/ because the iOS widget extension needs it too. Only this ONE file is
      # pulled in here — Shared/HubVoiceIntent.swift is an iOS AppIntent with no macOS counterpart.
      - path: Shared/Auth.swift
      - path: AssetsMac.xcassets
    entitlements:
      path: StatusHubMac.entitlements
      properties:
        # Hardened runtime blocks the mic without this; needed for getUserMedia in the web view.
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_NAME: Status Hub
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
