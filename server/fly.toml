app = "jared-status-hub"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # A wall display depends on this around the clock, so it does not get to sleep. Suspending saved
  # nothing real — the Pi kiosk polls constantly anyway — and cost a visible reload every time:
  # .xinitrc kills Chromium when the hub goes unreachable-then-reachable, so each wake blinked the
  # wall. It also put a cold start in front of opening the dashboard on the phone.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  # 512 MB, not 256: node holds ~100 MB, and at 256 MB ffmpeg's shared libraries no longer fit in the
  # page cache beside it, so every ffmpeg launch (the watch's live remux, the speaker check, a
  # re-encode) re-reads them off disk and takes 7-20 s instead of a fraction of one. Every voice
  # command waits on at least one of those.
  memory = "512mb"
