app = "jared-status-hub"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # A wall display depends on this around the clock, so it does not get to sleep. Suspending saved
  # nothing real — the Pi kiosk polls constantly anyway — and cost a visible reload every time:
  # .xinitrc kills Chromium when the hub goes unreachable-then-reachable, so each wake blinked the
  # wall. It also put a cold start in front of opening the dashboard on the phone.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
