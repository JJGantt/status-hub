<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alarm</title>
<!--
  A PAGE THAT RINGS ITSELF.
  The device alarm path cannot be relied on here: AlarmKit acks an alarm it then fails to present,
  and the silent push that carries a new alarm to a sleeping phone is rationed and refused. Both
  failures are silent. This page has neither dependency — it is already open, already holds the
  stream, and owns a speaker. It rings from a LOCAL timer to the moment, so nothing has to be
  delivered at the moment itself.

  Left open on a phone, it is the alarm clock. Everything here follows from that: the screen must
  stay lit (wake lock), the sound must be unlocked by a tap before it is needed (iOS will not play
  audio that no gesture ever authorised), and the schedule must survive a socket dying.
-->
<style>
  :root { --bg:#0b0d10; --fg:#e9edf2; --dim:#7c8794; --hot:#ff3b30; --ok:#30d158; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font: 500 16px/1.3 ui-rounded, -apple-system, system-ui, sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px; padding:24px; text-align:center; user-select:none; }
  #clock { font-size:19vw; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  #next { font-size:20px; color:var(--dim); font-variant-numeric:tabular-nums; }
  #next b { color:var(--fg); font-weight:700; }
  #count { font-size:15px; color:var(--dim); font-variant-numeric:tabular-nums; }
  button { font:inherit; font-size:17px; font-weight:700; color:var(--fg); background:#1b2027;
    border:1px solid #2b323c; border-radius:14px; padding:16px 30px; }
  button:active { background:#252c35; }
  #state { font-size:13px; letter-spacing:.14em; color:var(--hot); }
  #state.on { color:var(--ok); }
  /* Ringing: the whole screen is the indicator, because the phone may be across the room. */
  body.ring { background:var(--hot); }
  body.ring #clock, body.ring #next, body.ring #count, body.ring #state { color:#fff; }
  body.ring #test { display:none; }
  #stop { display:none; background:#fff; color:var(--hot); border-color:#fff; font-size:22px; padding:22px 52px; }
  body.ring #stop { display:block; }
  @keyframes flash { 50% { opacity:.55; } }
  body.ring { animation: flash .9s steps(1,end) infinite; }
</style>

<div id="clock">--:--</div>
<div id="next">—</div>
<div id="count"></div>
<button id="test">TEST</button>
<button id="stop">STOP</button>
<div id="state">SOUND OFF</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const hhmm = (d) => `${((d.getHours() + 11) % 12) + 1}:${pad(d.getMinutes())}`;

  // ---- sound ---------------------------------------------------------------
  // Web Audio rather than an <audio> file: no asset to fetch at 4am, and the gain is ours to set.
  // iOS will not let a page make noise until a gesture has authorised it, and that authorisation
  // belongs to the AudioContext — so TEST is not a convenience, it is what arms this page.
  let actx = null, ringT = null;
  function unlock() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx.state === 'running';
  }
  function beep(at, freq) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(1, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + 0.32);
    o.connect(g); g.connect(actx.destination);
    o.start(at); o.stop(at + 0.36);
  }
  function burst() {
    if (!actx) return;
    const t = actx.currentTime;
    beep(t, 880); beep(t + 0.42, 880); beep(t + 0.84, 1175);
  }
  function showState() {
    const on = !!actx && actx.state === 'running';
    $('state').textContent = on ? 'SOUND READY' : 'SOUND OFF';
    $('state').classList.toggle('on', on);
  }

  // ---- ringing -------------------------------------------------------------
  function startRing(label) {
    if (ringT) return;
    document.body.classList.add('ring');
    $('next').innerHTML = `<b>${label || ''}</b>`;
    burst();
    ringT = setInterval(burst, 1400);
    if (navigator.vibrate) navigator.vibrate([600, 300, 600, 300, 600]);
  }
  function stopRing() {
    clearInterval(ringT); ringT = null;
    document.body.classList.remove('ring');
    schedule();
  }
  $('stop').addEventListener('click', stopRing);

  // ---- the schedule --------------------------------------------------------
  // A LOCAL TIMER TO THE MOMENT, not a poll asking whether it has arrived. Nothing changes in the
  // database when 8:30 happens, so the only thing that can notice is something already awake — and
  // this page is, by definition, since it is the alarm.
  let items = [], fireT = null, firedKeys = new Set();
  const keyOf = (it) => `${it.id}:${it.when}`;

  async function load() {
    try {
      const r = await fetch('/api/due-widget', { cache: 'no-store' });
      const d = await r.json();
      items = (d.items || []).filter((x) => x.alarm && x.when);
      schedule();
    } catch (_) { /* keep whatever schedule is already held */ }
  }

  function nextItem() {
    const now = Date.now();
    return items
      .map((x) => ({ ...x, at: new Date(x.when).getTime() }))
      .filter((x) => Number.isFinite(x.at) && x.at > now - 60000 && !firedKeys.has(keyOf(x)))
      .sort((a, b) => a.at - b.at)[0] || null;
  }

  function schedule() {
    clearTimeout(fireT); fireT = null;
    const n = nextItem();
    if (!n) { $('next').textContent = '—'; $('count').textContent = ''; return; }
    $('next').innerHTML = `<b>${hhmm(new Date(n.at))}</b> &nbsp;${n.title || ''}`;
    // setTimeout is capped and drifts over hours, so re-arm in steps and only take the final
    // short hop as the real one. A phone that slept through part of the gap still lands right.
    const ms = n.at - Date.now();
    if (ms > 60000) { fireT = setTimeout(schedule, Math.min(ms - 30000, 900000)); return; }
    fireT = setTimeout(() => { firedKeys.add(keyOf(n)); startRing(n.title); }, Math.max(ms, 0));
  }

  // ---- keeping the screen lit ---------------------------------------------
  // The page is only the alarm while it is on screen. A locked phone stops running timers on a
  // schedule anyone can rely on, so the wake lock IS part of the mechanism, not a nicety. iOS drops
  // it on every visibility change, so it is re-taken rather than taken once.
  let lock = null;
  async function keepAwake() {
    try {
      if (!('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; });
    } catch (_) { lock = null; }
  }
  document.addEventListener('visibilitychange', () => { if (!lock) keepAwake(); schedule(); });

  // ---- staying current -----------------------------------------------------
  // The stream is how a change made at 4am reaches this page; the interval behind it is a backstop
  // for a socket that has gone deaf while still looking open, which is a failure seen here before.
  try {
    const es = new EventSource('/api/stream');
    es.addEventListener('message', () => load());
    es.addEventListener('error', () => {});
  } catch (_) {}
  setInterval(load, 120000);

  // ---- boot ----------------------------------------------------------------
  $('test').addEventListener('click', async () => {
    unlock(); burst(); showState();
    await keepAwake();
    load();
  });
  setInterval(() => { $('clock').textContent = hhmm(new Date()); }, 1000);
  $('clock').textContent = hhmm(new Date());
  setInterval(() => {
    const n = nextItem();
    if (!n || ringT) { $('count').textContent = ''; return; }
    const s = Math.max(0, Math.round((n.at - Date.now()) / 1000));
    $('count').textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
  }, 1000);
  showState();
  load();
})();
</script>
