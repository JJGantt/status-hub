<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Status Hub</title>
<link rel="stylesheet" href="app.css">
<!-- One bundle per page, built by build.js from public/pages/index.js — that file
     lists the modules this page runs, and is where you add or remove one. -->
<script type="module" src="dist/index.js"></script>
</head><body>
<div class="rows">
  <!-- CHAT (page 0, default) — full-height shared conversation (hub/agent threads). No card chrome,
       no name; settings live in the bottom navbar. Reached from the wall via the navbar chat button. -->
  <div class="row-card airow">
    <div class="ai-shell">
      <div class="ai-head"><span class="ai-mode">Hub</span><button class="ai-reset" id="ai-reset" type="button" title="Start a fresh conversation">Reset context</button></div>
      <div class="ai-log" id="ai-log"></div>
      <div class="ai-input">
        <button class="ai-mic" id="ai-mic" type="button" aria-label="Tap to talk"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg></button>
        <input class="ai-text" id="ai-text" type="text" placeholder="Message…" autocomplete="off">
        <button class="ai-send" id="ai-send" type="button">Send</button>
      </div>
      <div class="ai-status" id="ai-status"></div>
    </div>
  </div>

  <!-- MISC (page 1, #misc) — everything that isn't on the wall: device chips + voice liveness + surf.
       Reached from the wall via the navbar toggle. The nutrition/muscle/workout detail pages that used
       to live here are gone — the interactive wall IS that detail now. -->
  <div class="row-card statusrow">
    <div class="card statuscard"><div class="fit" id="litter"><h2>Litter-Robot</h2><div class=big>…</div></div></div>
    <div class="card statuscard"><div class="fit" id="feeder"><h2>Cat Feeder</h2><div class=big>…</div></div></div>
    <div class="card statuscard"><div class="fit" id="mics"><h2>Voice System</h2><div class=big>…</div></div></div>
    <div class="card statuscard"><div class="fit" id="surf"><h2>Surf</h2><div class=big>…</div></div>
      <div id="weather"></div></div>
  </div>
</div>
</body></html>
