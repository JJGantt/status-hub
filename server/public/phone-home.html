<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Status Hub</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="calendar.css">
<link rel="stylesheet" href="phone-home.css">
<!-- One bundle per page, built by build.js from public/pages/phone-home.js — that file
     lists the modules this page runs, and is where you add or remove one. -->
<script type="module" src="dist/phone-home.js"></script>
</head><body class="tv phonehome phonewall">
<!-- THE PHONE'S HOME PAGE, at `/`. Everything the home wall (/tv) carries, in portrait, at the
     phone's OWN scale — no scaled canvas — and IN ONE SCREEN. Nothing here scrolls vertically; that
     is the constraint the whole layout answers, and it is why every block below is either a fixed
     height or the one block that absorbs what the others did not need (the day strip).

     `tv` is here for the card styling the walls share (black ground, no card headings, the heat
     maps, the rings, the strips). `phonewall` is here so every card that asks takes its PHONE
     branch — surf keeps its weekday letters and hour labels, the muscle detail opens as a sheet.
     `phonehome` is this page: it turns the kiosk verdict off whatever the window width, and it is
     what phone-home.css hangs its layout on. It asks for NO heat trim — `homewall` would give it the
     15-week one — because its maps scroll: the box decides what is on screen and the rest is a drag
     away, and a trim cannot carry the archive anyway (see heatPick in shared.js).

     Swipe panes: [sessions] [home] [reports], landing on home. There is no
     chat pane — the hub conversation is on this page, and the navbar's microphone is how you answer
     it, so the pane left of home is the sessions view instead. -->
<!-- TYPING TO THE HUB. The conversation is on the home page and the navbar's microphone answers it,
     but a keyboard is the other half of that and a composer alone is not enough: while typing you
     have to see what you are replying to. So the keyboard button opens the FULL chat — the same
     `ai-shell` the walls carry, the same `initCard()` in voiceagent.js wiring it — as a sheet over
     the page, with the whole thread scrolled to its newest line.
     Outside `#wallpanes` on purpose: it covers whatever pane is open rather than being one. -->
<div class="ph-chat" id="ph-chat">
  <div class="ai-shell">
    <div class="ai-head"><span class="ai-mode" id="ai-mode" title="Active conversation mode">Hub</span><button class="ai-reset" id="ai-reset" type="button" title="Start a fresh conversation">Reset context</button><button class="ph-chat-x" id="ph-chat-x" type="button" aria-label="Close">✕</button></div>
    <div class="ai-log" id="ai-log"></div>
    <div class="ai-input">
      <button class="ai-mic" id="ai-mic" type="button" aria-label="Tap to talk"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg></button>
      <input class="ai-text" id="ai-text" type="text" placeholder="Message…" autocomplete="off">
      <button class="ai-send" id="ai-send" type="button">Send</button>
      <div class="ai-status" id="ai-status"></div>
    </div>
  </div>
</div>

<div class="wallpanes" id="wallpanes">


<!-- SESSIONS, immediately left of home. The list of what is running, and — tapping a row, here or on
     the home page's own session list — that session's whole conversation with a composer to answer
     it. This is the one pane you arrive at by swiping rather than by tapping something, which is why
     it is the neighbour: the home page's session block is a way in, not the answer. -->
<section class="pane pane-repos">
  <!-- the Mac's repos (published by the orchestrator). Tap one to open a remote-controlled Claude
       session there and pick it up in the Claude app. cards/repos.js. -->
  <div class="card reposcard"><div id="repospane"></div></div>
</section>

<section class="pane pane-wall">
<div class="tv-shell">
  <div class="rows">

    <!-- HEALTH BAR — the three scores, lying on their side. -->
    <div class="healthbar" id="healthbar"></div>

    <!-- TODAY, LYING DOWN — hours left to right, items at their own time, stacked into lanes
         (cards/daystrip.js). The wall's dial is this same day standing up, which is the right shape
         for a tall column read across a room; a phone in portrait has width and no height, so the
         axis turns. It keeps going past midnight into the days after it, which is what makes the
         look-ahead cost nothing here.
         THIS IS THE BLOCK THAT ABSORBS SLACK: everything else on the screen is sized, and whatever
         height is left becomes more lanes. -->
    <div class="row-card ph-dayrow">
      <div class="card ph-daycard"><div class="ph-strip" id="ph-strip"></div></div>
    </div>
    <!-- THE CALENDAR, opened by tapping today on the strip above (expand.js, `cal`): the month
         (cards/month.js), the day as a timeline (cards/dayline.js mounts #daycard itself), and every
         list (cards/todo.js). Hidden here and moved into the sheet, so each keeps rendering. -->
    <div id="calsheet">
      <div class="card calmonth"><div id="calmonth"></div></div>
      <div class="card daycardwrap"><div id="daycard"></div></div>
      <div class="card todocard"><div id="todopane"></div></div>
    </div>
    <!-- UTILITIES, opened from the navbar (expand.js, `util`): the litter robot and the feeder. -->
    <div id="utilsheet" class="devcards">
      <div class="card statuscard"><div class="fit" id="litter"><h2>Litter-Robot</h2><div class=big>…</div></div></div>
      <div class="card statuscard"><div class="fit" id="feeder"><h2>Cat Feeder</h2><div class=big>…</div></div></div>
    </div>
    <!-- THE VOICE SYSTEM — the mics and the routing — shown at the bottom of Settings (settings.js). -->
    <div id="voicesys" class="devcards">
      <div class="card statuscard"><div class="fit" id="mics"><h2>Voice System</h2><div class=big>…</div></div></div>
      <div class="card statuscard"><div class="fit" id="tv-routing"></div></div>
    </div>

    <!-- FOOD and TRAINING, STACKED, with the body beside the workout half — the wall's arrangement.
         Each map is a small block at the LEFT of its section, at its own width; what it does not use
         is deliberately empty on the nutrition side and holds the figures on the training side.
         Under each map: what today came to, then the day itself as a scrolling list. The maps scroll
         too — sideways, through the whole archive (`data-history`, see heathistory.js). -->
    <div class="row-card ph-heatrow">
      <div class="card ph-heatcard">
        <div class="ph-heattop">

          <!-- THE FOOD SECTION: the map with its trend over it and its day under it, and the RINGS in
               the ground beside them. That ground was deliberately empty for a while; the rings are
               what it is for, and they belong here — they are today's calories and macros, next to
               the map of every day's. Moving them off the top of the page gave the conversation at
               the bottom seventy pixels it did not have. -->
          <div class="ph-nutsec">
            <div class="ph-nut">
              <!-- Weekly weigh-in average over the food map's own week columns. The alignment is the
                   chart: cards/weightweeks.js insets the box by half a column at each end, in calc
                   from --cols and the grid's gap, so --hgap must equal the gap in `.heat`. -->
              <div class="hw-wplot" id="weightweeks" data-history></div>
              <!-- THE WEIGHT PAGE, opened by tapping the plot above (expand.js, `wt`). Hidden here and
                   moved into the sheet, so it renders on every frame like any card: every weigh-in,
                   the trend, the intake bars and the maintenance curves the calorie target is built
                   on (cards/maintviz.js). -->
              <div class="card maintcard" id="weightcard"><div id="maintviz"></div></div>
              <div class="ph-block" id="nutritionlog" data-history>
                <div id="nutheat" class="nutheat"></div>
              </div>
              <!-- Every entry on the day, tapping open to its ingredients. `data-noband` drops the
                   day's totals line: each ring beside this carries its own `2699 / 3060` under the
                   gauge, which says what the band said and says which number it is without a label.
                   A band here as well was a second copy of that, and a height mismatch with the
                   rings — the two sides of this section now come out the same. -->
              <div class="ph-list" id="nutinfo" data-noband></div>
            </div>
            <div class="card ringcard"><div id="nutrition"><h2>Today · Nutrition</h2><div class=big>…</div></div></div>
          </div>

          <div class="ph-wksec">
            <div class="ph-wk">
              <div class="ph-block" id="workouts" data-history>
                <div id="heatwrap"></div>
              </div>
              <div class="hw-strip" id="resttimer"></div>
              <div class="ph-list" id="heatinfo"></div>
            </div>
            <!-- One figure in the markup; cards/muscle.js splits it into the front/back pair and
                 paints each region from volume.muscle_colors. Tapping a region opens #bodyinfo,
                 which muscle.js moves out to the document so the sheet is not trapped in here. -->
            <!-- `data-nosel` — a tap here does not pick a muscle, it OPENS (expand.js). At this size
                 the figures are 133px wide for two whole bodies, so a region is a few pixels and the
                 detail sheet it opens covers half the screen; picking one is a thing to do in the
                 expanded view, where the figures are big enough to aim at. -->
            <div class="ph-body" id="body" data-nosel><!--BODY_SVG--></div>
            <div id="bodyinfo"></div>
            <!-- The volume bars. Hidden on the page — there is no room for twenty-three of them on a
                 screen that already fits — and shown when expand.js moves it into the sheet beside
                 the figures, which is the one place they have ever been readable on a phone. -->
            <div id="volume"></div>
          </div>

        </div>
      </div>
    </div>

    <!-- SURF and WHAT IS RUNNING, on one row. The plots are bare here — no weekday letters, no hour
         labels, no current-conditions strip — because every one of those answers a question the
         picture has already answered, and this card is a fifth of the screen. The two that stay are
         the water temperature and the rain grid's peak: no colour or placement carries those.
         The session rows are titles and the one line of what each is doing; TAPPING one opens it in
         the session view, which is the lists pane's, with the whole conversation and a composer. -->
    <div class="row-card ph-surfrow">
      <div class="card ph-surfcard">
        <div class="fit" id="surf"><h2>Surf</h2><div class=big>…</div></div>
        <div id="weather"></div>
      </div>
      <div class="card ph-sesscard">
        <div class="ph-sess-list" id="ph-sess-list"></div>
      </div>
    </div>

    <!-- THE CONVERSATION — the tail of the hub thread, scrolling, pinned to the newest line. It is
         the block that takes whatever height the rest of the screen did not need, because it is the
         only one here that can spend an arbitrary amount of it: more room is simply more of the
         conversation. Answering it is the navbar's microphone. -->
    <div class="row-card ph-convrow">
      <div class="card ph-convcard"><div class="ph-conv" id="ph-conv"></div></div>
    </div>

  </div>
</div>
</section>




<section class="pane pane-reports">
  <!-- the write-ups those sessions hand back when they finish. Sits next to the launcher because it
       is the same loop seen from the other end: repos sends work out, this is what returns. -->
  <div class="card reportscard"><div id="reportspane"></div></div>
  <!-- Sound bench. Here because this pane is the far right one and reachable inside Guided Access,
       which is the only place the question can be answered. Remove once it is. -->
  <div class="card"><div id="audiotest"></div></div>
</section>

</div>
</body></html>
