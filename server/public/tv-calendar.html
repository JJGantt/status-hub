<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Status Hub · Calendar</title>
<link rel="stylesheet" href="app.css">
<!-- Only this page: the calendar wall's own layout and panel. app.css is shared and unmodified. -->
<link rel="stylesheet" href="tv-calendar.css">
<!-- core.js renders the REAL hub cards from /api/stream into the .rows below (same as the main hub). -->
<script type="module" src="core.js"></script>
<!-- tv.js layers the compact voice-conversation panel + session terminal on top. -->
<script type="module" src="tv.js"></script>
<!-- wall.js: on a phone-sized viewport, scale the whole 1920×1080 shell to fit (phone "wall mode"). -->
<script type="module" src="wall.js"></script>
<!-- wallmode.js: follow the wall_mode setting, so the TV can be switched between walls by voice. -->
<script type="module" src="wallmode.js"></script>
<!-- expand.js: phone-wall expand icons → full-screen section sheets (nutrition / workouts). -->
<script type="module" src="expand.js"></script>
<!-- tv-calendar.js: the day timeline + the month grid(s), from /api/calendar?wall=1. -->
<script type="module" src="tv-calendar.js"></script>
</head><body class="tv">
<!-- wallpanes: on the PHONE this is a three-pane swipe — [chat] [wall] [misc] — landing on the wall.
     On the big-screen kiosk the side panes are display:none and only the shell renders. -->
<div class="wallpanes" id="wallpanes">

<section class="pane pane-chat">
  <div class="ai-shell">
    <div class="ai-head"><span class="ai-mode" id="ai-mode" title="Active conversation mode">Hub</span><button class="ai-reset" id="ai-reset" type="button" title="Start a fresh conversation">Reset context</button></div>
    <div class="ai-log" id="ai-log"></div>
    <div class="ai-input">
      <button class="ai-mic" id="ai-mic" type="button" aria-label="Tap to talk"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg></button>
      <input class="ai-text" id="ai-text" type="text" placeholder="Message…" autocomplete="off">
      <button class="ai-send" id="ai-send" type="button">Send</button>
    </div>
    <div class="ai-status" id="ai-status"></div>
  </div>
</section>

<section class="pane pane-wall">
<!-- tv-shell: the full hub dashboard (main) + a compact voice column (aside). -->
<div class="tv-shell">

  <!-- MAIN: the persistent wall frame — status strip, rings, health bar, footer — around the calendar. -->
  <div class="rows">
    <!-- ROW 1 — status strip across the top: devices (litter) + agent routing + surf forecast -->
    <div class="row-card statusrow">
      <div class="card statuscard"><div class="fit" id="litter"><h2>Litter-Robot</h2><div class=big>…</div></div></div>
      <div class="card statuscard tv-routecard"><div class="fit" id="tv-routing"></div></div>
      <div class="card statuscard tv-surfcard"><div class="fit" id="surf"><h2>Surf</h2><div class=big>…</div></div></div>
    </div>

    <!-- COL 1 — calorie + macro rings, stacked vertically in their own column -->
    <div class="row-card ringrow">
      <div class="card ringcard"><div class="fit"><div id="nutrition"><h2>Today · Nutrition</h2><div class=big>…</div></div></div></div>
    </div>

    <!-- CALENDAR — the point of this wall. A day timeline on the left of the freed space (today's
         items on hour slots, with a line marking where in the day it is), and beside it the month
         grid — one month, or however many `calendar_months` asks for. Painted by tv-calendar.js,
         which only this page loads; the other walls share none of it. -->
    <div class="row-card calrow">
      <div class="card calcard"><div class="fit">
        <div class="cw-day" id="cw-day"></div>
        <div class="cw-months" id="cw-months"></div>
      </div></div>
    </div>

    <!-- HEALTH BAR — overall score as a vertical gauge on the far right (painted by cards/score.js) -->
    <div class="healthbar" id="healthbar"></div>
    <!-- ROW 3 — persistent footer: live voice activity on the left, and on the right the session a
         spoken follow-up would land in. A real grid row rather than an overlay, so the cards above
         shrink to fit it instead of being covered by it. -->
    <div class="tv-footrow">
      <div class="tv-foot-act" id="tv-act"></div>
      <div class="tv-foot-follow" id="tv-follow"></div>
    </div>
  </div>

  <!-- ASIDE: compact voice column — the live hub voice conversation. -->
  <aside class="tv-voice">
    <header class="tv-voice-head"><span class="tv-focus-label">Conversation</span></header>
    <div class="tv-convo-log" id="tv-log"></div>
  </aside>

</div>
</section>

<section class="pane pane-misc">
  <!-- litter + surf cards are MOVED here from the shell by wall.js on the phone (they already exist
       in the shell markup; two elements can't share an id). Feeder + mics render here directly. -->
  <div class="misc-slot" id="misc-surf-slot"></div>
  <div class="card statuscard"><div class="fit" id="feeder"><h2>Cat Feeder</h2><div class=big>…</div></div></div>
  <div class="misc-slot" id="misc-litter-slot"></div>
  <div class="card statuscard"><div class="fit" id="mics"><h2>Voice System</h2><div class=big>…</div></div></div>
</section>

</div>
</body></html>
