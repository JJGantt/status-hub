<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Status Hub · Home</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="tv-home.css">
<!-- One bundle per page, built by build.js from public/pages/tv-home.js — that file
     lists the modules this page runs, and is where you add or remove one. -->
<script type="module" src="dist/tv-home.js"></script>
</head><body class="tv homewall">
<!-- THE HOME WALL — the default, at `/` and `/tv`. The frame every wall shares (status strip · rings
     · health bar · footer · voice column) around four columns: today's timeline, the six days after
     it, the heat maps, and the newest session's last answer. The deep nutrition/muscle/workout surface it replaced is the
     HEALTH wall at /tv-health; this one keeps only what a glance from across the room can use. -->
<div class="wallpanes" id="wallpanes">

<section class="pane pane-chat">
  <div class="ai-shell">
    <div class="ai-head"><span class="ai-mode" id="ai-mode" title="Active conversation mode">Hub</span><button class="ai-reset" id="ai-reset" type="button" title="Start a fresh conversation">Reset context</button></div>
    <div class="ai-log" id="ai-log"></div>
    <div class="ai-input">
      <button class="ai-mic" id="ai-mic" type="button" aria-label="Tap to talk"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg></button>
      <input class="ai-text" id="ai-text" type="text" placeholder="Message…" autocomplete="off">
      <button class="ai-send" id="ai-send" type="button">Send</button>
    </div>
    <div class="ai-status" id="ai-status"></div>
  </div>
</section>

<section class="pane pane-wall">
<!-- tv-shell: the full hub dashboard (main) + a compact voice column (aside). -->
<div class="tv-shell">

  <div class="rows">
    <!-- ROW 1 — status strip across the top: devices (litter) + agent routing. Surf is NOT here on
         this wall: it is a heat map, so it lives with the other two in column 3. -->
    <div class="row-card statusrow">
      <div class="card statuscard"><div class="fit" id="litter"><h2>Litter-Robot</h2><div class=big>…</div></div></div>
      <div class="card statuscard tv-routecard"><div class="fit" id="tv-routing"></div></div>
    </div>

    <!-- COL 1 — calorie + macro rings, stacked vertically in their own column -->
    <div class="row-card ringrow">
      <div class="card ringcard"><div class="fit"><div id="nutrition"><h2>Today · Nutrition</h2><div class=big>…</div></div></div></div>
    </div>

    <!-- COL 2 — today, on hour rows. The calendar wall's day column, same module and same endpoint
         (cards/dayline.js); this wall simply shows it without the months beside it. -->
    <div class="row-card hw-dayrow">
      <div class="card hw-daycard"><div class="fit"><div class="cw-day" id="cw-day"></div></div></div>
    </div>

    <!-- COL 3 — THE LOOK-AHEAD: the six days after today, a box each, painted from the same
         /api/calendar response as the column beside it (cards/dayline.js). It is the other half of
         the question the dial asks, in the other grammar: a list of what is ON each day rather than
         a timeline of where in it.
         The response asks for SEVEN days: the first one back is today, and it feeds the dock at the
         bottom of the dial rather than a box here. See paintEdges in cards/dayline.js. -->
    <div class="row-card hw-weekrow">
      <div class="card hw-weekcard"><div class="fit"><div class="cw-week" id="cw-week"></div></div></div>
    </div>

    <!-- COL 4 — the heat maps, stacked. Each carries the strip that belongs to it: the day's totals
         against target under nutrition, the rest/session clocks under workouts. Surf sits below both
         behind a rule, because its columns are HOURS OF ONE DAY where theirs are whole weeks — the
         same grammar would be a lie. -->
    <div class="row-card hw-heatrow">
      <div class="card hw-heatcard"><div class="fit">
        <!-- The two week-grained heat maps, with the muscle column running the height of BOTH. Surf
             stays below at full width: its columns are hours of one day, not weeks. -->
        <div class="hw-heattop">
          <div class="hw-heatstack">
            <!-- Weekly weigh-in average, on the same week columns as the two maps under it. It is
                 above BOTH because it belongs to neither: it is a third reading of the same axis,
                 and the two blocks below each carry their own strip. -->
            <div class="hw-wplot" id="weightweeks"></div>
            <div class="hw-block">
              <div id="nutheat" class="nutheat"></div>
              <div class="hw-strip" id="nutinfo" data-band></div>
              <div class="hw-recent" id="nutrecent"></div>
            </div>
            <div class="hw-block">
              <div id="heatwrap"></div>
              <div class="hw-strip" id="resttimer"></div>
              <div class="hw-recent" id="heatinfo" data-recent></div>
            </div>
          </div>
          <!-- One figure; cards/muscle.js splits it into the stacked front/back pair and paints each
               region from volume.muscle_colors, exactly as on the health wall. #bodyinfo is present
               but hidden — the selection handlers write to it and this wall cannot show a panel. -->
          <div class="hw-body" id="body"><!--BODY_SVG--></div>
          <div id="bodyinfo" hidden></div>
        </div>
        <!-- Surf is its OWN card inside the column, unlike the two above it: on a phone wall.js
             adopts it into the misc pane, and it does that by moving the nearest `.card` — which
             was this whole column until surf had one of its own. The rain grid rides inside that
             card rather than beside it, so adopting surf onto the phone takes weather with it: they
             are one week of one place, read together. -->
        <div class="hw-block hw-surf card">
          <div class="fit" id="surf"><h2>Surf</h2><div class=big>…</div></div>
          <div id="weather"></div>
        </div>
      </div></div>
    </div>

    <!-- COL 5 — what is running, and what the focused one last said. The list is numbered the way
         voice numbers them, so "the second session" is the second line. Display-only: voice starts
         them, voice focuses them, and this is where the answer lands. -->
    <div class="row-card hw-sessrow">
      <div class="card hw-sesscard"><div class="fit">
        <div class="hw-sess-list" id="hw-sess-list"></div>
        <div class="hw-sess-head" id="hw-sess-head"></div>
        <div class="hw-sess-reply" id="hw-sess-reply"></div>
      </div></div>
    </div>

    <!-- HEALTH BAR — overall score as a vertical gauge on the far right (painted by cards/score.js) -->
    <div class="healthbar" id="healthbar"></div>
    <!-- ROW 3 — persistent footer: live voice activity on the left, and on the right the session a
         spoken follow-up would land in. A real grid row rather than an overlay, so the cards above
         shrink to fit it instead of being covered by it. -->
    <div class="tv-footrow">
      <div class="tv-foot-act" id="tv-act"></div>
      <div class="tv-foot-follow" id="tv-follow"></div>
    </div>
  </div>


</div>
</section>

<section class="pane pane-misc">
  <!-- litter + surf are MOVED here from the shell by wall.js on the phone (they already exist in the
       shell markup; two elements can't share an id). Feeder + mics render here directly. Surf is
       adopted even though the shell has a place for it: in the scaled wall it is a thumbnail, and
       this pane is where it is actually read on a phone. -->
  <div class="misc-slot" id="misc-surf-slot"></div>
  <div class="card statuscard"><div class="fit" id="feeder"><h2>Cat Feeder</h2><div class=big>…</div></div></div>
  <div class="misc-slot" id="misc-litter-slot"></div>
  <div class="card statuscard"><div class="fit" id="mics"><h2>Voice System</h2><div class=big>…</div></div></div>
</section>

<section class="pane pane-maint">
  <!-- maintenance-window visualization: the data the adaptive calorie target is based on
       (cards/maintviz.js renders it from the stream's maintenance.viz). Phone swipe pane only. -->
  <div class="card maintcard"><div id="maintviz"></div></div>
</section>

<section class="pane pane-todo">
  <!-- Today's timeline first — the same module the wall column uses, at phone scale (cards/dayline.js
       mounts #daycard itself). Then the lists, with dated items surfaced in a Due view. Voice/MCP
       writes them; cards/todo.js renders + edits. Phone pane only. -->
  <div class="card daycardwrap"><div id="daycard"></div></div>
  <div class="card todocard"><div id="todopane"></div></div>
</section>

<section class="pane pane-repos">
  <!-- the Mac's repos (published by the orchestrator). Tap one to open a remote-controlled Claude
       session there and pick it up in the Claude app. cards/repos.js. Phone pane only. -->
  <div class="card reposcard"><div id="repospane"></div></div>
</section>

<section class="pane pane-reports">
  <!-- the write-ups those sessions hand back when they finish. Sits next to the launcher because it
       is the same loop seen from the other end: repos sends work out, this is what returns.
       cards/reports.js. Phone pane only. -->
  <div class="card reportscard"><div id="reportspane"></div></div>
</section>

</div>
</body></html>
