<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Status Hub · Sidebar</title>
<!-- The focused session, the voice orchestrator's conversation, or whatever an agent put on it: the sidebar the bedroom TV's companion app overlays on whatever is playing
     (google-tv repo, SidebarService). See docs/HUB-INTERNALS.md § The TV sidebar. -->
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden}
  body{font:17px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:#fff}
  #sb{position:absolute;top:0;right:0;bottom:0;width:35vw;max-width:100vw;display:flex;flex-direction:column;background:rgba(0,0,0,.55);
      text-shadow:0 1px 2px rgba(0,0,0,.9)}
  #vo,#ss,#cv{flex:1;min-height:0;display:flex;flex-direction:column}
  #vo[hidden],#ss[hidden],#cv[hidden]{display:none}
  #cv-body{flex:1;overflow:hidden;padding:22px}
  #cv-body ul,#cv-body ol{margin:0 0 8px;padding-left:1.3em}
  .md-h{font-weight:600;margin:10px 0 6px}
  .md-h1,.md-h2{font-size:1.25em}
  .md-h3{font-size:1.1em}
  .md-hr{border:0;border-top:1px solid rgba(255,255,255,.25);margin:10px 0}
  #sb-name,#vo-name{flex:none;padding:18px 22px 10px;font-weight:600;font-size:1.1em;white-space:nowrap;
           overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(255,255,255,.15)}
  #sb-body,#vo-body{flex:1;overflow:hidden;padding:12px 22px 22px;display:flex;flex-direction:column;justify-content:flex-end;
           -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 70px);mask-image:linear-gradient(to bottom,transparent 0,#000 70px)}
  .sb-words{color:#8ab4e8;margin:14px 0 6px;white-space:pre-wrap}
  .sb-tool{color:#b39ddb;font-size:.8em;margin:6px 0 2px}
  .sb-args{color:#9e8fc2;font-size:.85em;word-break:break-all;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
  .sb-thought{color:#c8c8c8;font-size:.85em;margin:4px 0}
  .sb-reply{margin:6px 0}
  .sb-sess{color:#9fe3d3}
  .sb-reply p,.sb-thought p{margin:0 0 8px}
  .sb-reply pre,.sb-reply code{font-size:.75em;white-space:pre-wrap}
  .sb-reply table{border-collapse:collapse;font-size:.8em}
  .sb-reply td,.sb-reply th{border:1px solid rgba(255,255,255,.2);padding:2px 6px}
  .sb-caret{color:#8ab4e8;animation:sbp 1.2s ease-in-out infinite}
  @keyframes sbp{50%{opacity:.35}}
  .sb-dots{display:inline-flex;gap:.3em;align-items:center;height:1em}
  .sb-dots i{width:.28em;height:.28em;border-radius:50%;background:#8ab4e8;animation:sbd 1.1s ease-in-out infinite}
  .sb-dots i:nth-child(2){animation-delay:.18s}
  .sb-dots i:nth-child(3){animation-delay:.36s}
  @keyframes sbd{0%,60%,100%{opacity:.25}30%{opacity:1}}
</style>
<script type="module" src="dist/tv-sidebar.js"></script>
</head><body>
<div id="sb">
<div id="vo" hidden><div id="vo-name">Orchestrator</div><div id="vo-body"></div></div>
<div id="ss"><div id="sb-name"></div><div id="sb-body"></div></div>
<div id="cv" hidden><div id="cv-body"></div></div>
</div>
</body></html>
