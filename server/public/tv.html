<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Status Hub · TV</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<!-- core.js renders the REAL hub cards from /api/stream into the .rows below (same as the main hub). -->
<script type="module" src="core.js"></script>
<!-- tv.js layers the compact voice-conversation panel + session terminal on top. -->
<script type="module" src="tv.js"></script>
</head><body class="tv">
<!-- tv-shell: the full hub dashboard (main) + a compact voice column (aside). -->
<div class="tv-shell">

  <!-- MAIN: the entire real hub — identical markup to index.html so every card renders the same. -->
  <div class="rows">
    <!-- ROW 1 — status strip across the top: devices (litter) + agent routing + surf forecast -->
    <div class="row-card statusrow">
      <div class="card statuscard"><div class="fit" id="litter"><h2>Litter-Robot</h2><div class=big>…</div></div></div>
      <div class="card statuscard tv-routecard"><div class="fit" id="tv-routing"></div></div>
      <div class="card statuscard tv-surfcard"><div class="fit" id="surf"><h2>Surf</h2><div class=big>…</div></div></div>
    </div>

    <!-- COL 1 — calorie + macro rings, stacked vertically in their own column -->
    <div class="row-card ringrow">
      <div class="card ringcard"><div class="fit"><div id="nutrition"><h2>Today · Nutrition</h2><div class=big>…</div></div></div></div>
    </div>

    <!-- COL 2 — nutrition: calorie heatmap (top, mirrors the sets heatmap) · food list (mid) · cal/weight plot (bottom) -->
    <div class="row-card nutrow">
      <div class="card nutcard"><div class="fit" id="nutritionlog">
        <div id="nutheat" class="nutheat"></div>
        <div class="detailpanel nutfoods"><div id="nutinfo"></div></div>
        <div id="nutplot" class="nutplot"></div>
      </div></div>
    </div>

    <!-- COL 3 — muscle: body map (top 25%) + volume bars (bottom 75%) -->
    <div class="row-card musclerow">
      <div class="card musmap"><div class="fit" id="body"><h2>Muscle Map · 7-Day</h2><!--BODY_SVG--></div></div>
      <div class="card musvol"><div class="fit" id="volume"><h2>Muscle Volume · 7-Day</h2><div>…</div></div></div>
      <div class="card musdetail"><div class="fit detailpanel"><div id="bodyinfo"></div></div></div>
    </div>

    <!-- COL 4 — workout: sets heatmap (top) + tapped-day set list -->
    <div class="row-card workoutrow">
      <div class="card wkheat"><div class="fit" id="workouts"><h2>Workout Volume</h2><div id="heatwrap"></div><div id="resttimer" class="resttimer"></div></div></div>
      <div class="card wkdetail"><div class="fit detailpanel"><div id="heatinfo"></div></div></div>
    </div>

    <!-- BOTTOM STRIP — transient live process feed (working/tools → resolution, then fades). A long
         strip reserved for notifications + the emission stream; for now just the emission stream. -->
    <div class="row-card emitstrip"><div id="emit" class="emit"></div></div>

    <!-- HEALTH BAR — overall score as a vertical gauge on the far right (painted by cards/score.js) -->
    <div class="healthbar" id="healthbar"></div>
  </div>

  <!-- ASIDE: compact voice column. Conversation panel when focus=='hub'; session terminal overlays when focused. -->
  <aside class="tv-voice">
    <header class="tv-voice-head" id="tv-focus" data-focus="hub">
      <span class="tv-focus-dot"></span><span class="tv-focus-label">Hub</span>
    </header>
    <!-- focus == 'hub': minimal conversation log (live voice_messages). -->
    <div class="tv-convo-log" id="tv-log"></div>
    <!-- Focusable Mac sessions, live from /api/voice-sessions. -->
    <div class="tv-sessions" id="tv-sessions"></div>
    <!-- focus != 'hub': xterm terminal overlays the voice column. -->
    <div class="tv-term" id="tv-term" hidden></div>
  </aside>

</div>
</body></html>
