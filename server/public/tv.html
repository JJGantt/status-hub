<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Status Hub · TV</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<script type="module" src="tv.js"></script>
</head><body class="tv">
<div class="tv-grid">
  <!-- LEFT: trimmed HUD summary, fed from /api/stream (same assembled status frame the dashboard uses). -->
  <aside class="tv-hud">
    <div class="tv-hudcard" id="tv-litter"></div>
    <div class="tv-hudcard" id="tv-nutrition"></div>
    <div class="tv-hudcard" id="tv-workout"></div>
    <!-- Focusable Mac sessions (the 5 most recent), live from /api/voice-sessions. -->
    <div class="tv-hudcard tv-sessions" id="tv-sessions"></div>
    <div class="tv-hudfoot" id="tv-foot"></div>
  </aside>

  <!-- RIGHT: the main new element — live Claude conversation panel for the current focus. -->
  <main class="tv-convo">
    <!-- Focus header. Phase 1 = "Hub"; Phase 2 swaps in a session label / terminal here (data-focus seam). -->
    <header class="tv-convo-head" id="tv-focus" data-focus="hub">
      <span class="tv-focus-dot"></span><span class="tv-focus-label">Hub</span>
    </header>
    <!-- focus == 'hub': conversation log. focus != 'hub': xterm terminal (below) takes over. -->
    <div class="tv-convo-log" id="tv-log"></div>
    <div class="tv-term" id="tv-term" hidden></div>
  </main>
</div>
</body></html>
